{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Login</h2>
  <form method="POST">
    {{ form.hidden_tag() }}
    <label>Username</label>
    {{ form.username(size=50) }}
    <label>Password</label>
    {{ form.password(size=50) }}
    <button type="submit">Login</button>
  </form>
  <p>Need an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
</div>
{% endblock %}
