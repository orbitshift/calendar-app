{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Register</h2>
  <form method="POST">
    {{ form.hidden_tag() }}
    <label>Username</label>
    {{ form.username(size=50) }}
    <label>Password</label>
    {{ form.password(size=50) }}
    <button type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a>.</p>
</div>
{% endblock %}
